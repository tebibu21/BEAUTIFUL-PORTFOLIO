<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bg)" stroke="#334155" stroke-width="3"/>
  <rect x="20" y="20" width="560" height="360" rx="10" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6"/>
  
  <!-- Certificate Header -->
  <circle cx="300" cy="90" r="32" fill="url(#gold)" opacity="0.2"/>
  <path d="M290 90 L297 97 L312 82" fill="none" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <text x="300" y="150" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="1">CERTIFICATE OF INTERNSHIP</text>
  <text x="300" y="180" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">Awarded for Software Development Internship</text>
  
  <!-- Recipient -->
  <text x="300" y="225" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="800" fill="#60A5FA" text-anchor="middle">Commercial Bank of Ethiopia (CBE)</text>
  <text x="300" y="260" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#CBD5E1" text-anchor="middle">Software Engineering &amp; IT Systems Department</text>
  
  <rect x="210" y="295" width="180" height="32" rx="16" fill="#1E293B" stroke="#3B82F6" stroke-width="1"/>
  <text x="300" y="316" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#93C5FD" text-anchor="middle">VERIFIED CREDENTIAL</text>
</svg>

